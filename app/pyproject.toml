[project]
name = "freerock"
version = "0.1.0"
description = "Music written for World of Warcraft: Forever, that follows the game"
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiohttp>=3.9",
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
    "pillow>=10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6",
    "lupa>=2.4",
]

[project.scripts]
freerock = "freerock.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["freerock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# The server keeps its parts under plain names (app["hub"], app["link"], app["conductor"]);
# aiohttp suggests typed keys instead, which is a matter of style here.
filterwarnings = ["ignore::aiohttp.web_exceptions.NotAppKeyWarning"]
