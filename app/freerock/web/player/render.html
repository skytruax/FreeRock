<!doctype html>
<html>
<head><meta charset="utf-8"><title>FreeRock offline render</title></head>
<body>
<script src="/player/engine.js"></script>
<script>
// Plays a scripted session through the real engine with real music, faster than real time, and
// hands the result back to freerock/offline.py. Used to make demo clips and to measure what the
// player would do over a stretch of play.
"use strict";
(async () => {
  try {
    const job = await (await fetch("/render/job")).json();
    const rate = job.asset.rate;
    const ctx = new OfflineAudioContext(2, Math.round(job.seconds * rate), rate);
    const loader = async (id, layer, start, end) => {
      const response = await fetch("/audio/" + id + "/" + layer + "?start=" + start + "&end=" + end);
      if (!response.ok) throw new Error("No audio (" + response.status + "): " + await response.text());
      return response.arrayBuffer();
    };
    const engine = new FreeRockEngine(ctx, loader, { random: () => 0 });
    await engine.setAsset(job.asset);
    await engine.setTarget(job.script[0][1]);
    await engine.start();

    // The engine is looked in on twice a second, as the live page does, and at each moment the
    // script changes the target. Moments are kept a hundredth of a second apart because the
    // renderer can only pause on its own block boundaries.
    const moments = new Map();
    for (let t = 0.5; t < job.seconds; t += 0.5) moments.set(Math.round(t * 100), []);
    for (const [time, target] of job.script.slice(1)) {
      const key = Math.max(Math.round(time * 100), 1);
      if (!moments.has(key)) moments.set(key, []);
      moments.get(key).push(target);
    }
    for (const [key, targets] of moments) {
      if (key / 100 >= job.seconds) continue;
      ctx.suspend(key / 100).then(async () => {
        for (const target of targets) await engine.setTarget(target);
        await engine.tick();
        ctx.resume();
      });
    }
    const buffer = await ctx.startRendering();
    const left = buffer.getChannelData(0), right = buffer.getChannelData(1);
    const out = new Int16Array(left.length * 2);
    for (let i = 0; i < left.length; i++) {
      out[2 * i] = Math.max(-32768, Math.min(32767, Math.round(left[i] * 32768)));
      out[2 * i + 1] = Math.max(-32768, Math.min(32767, Math.round(right[i] * 32768)));
    }
    await fetch("/render/log", { method: "POST", body: JSON.stringify({ log: engine.log, late: engine.late }) });
    await fetch("/render/done", { method: "POST", body: out.buffer });
  } catch (error) {
    await fetch("/render/failed", { method: "POST", body: String(error && error.stack || error) });
  }
})();
</script>
</body>
</html>
